name: Build and release Gabatee for Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gabatee-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check, test, and build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:installer

      - name: Upload tested Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: gabatee-windows-x64
          path: release/Gabatee-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+) {
            throw "package.json must contain a semantic version."
          }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it unchanged."
            exit 0
          }

          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($existingTag) {
            throw "Tag $tag exists without a release; refusing to overwrite it."
          }

          $installer = Get-ChildItem "release/Gabatee-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not built." }

          gh release create $tag $installer.FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Gabatee $tag" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw "Publishing the GitHub Release failed." }
